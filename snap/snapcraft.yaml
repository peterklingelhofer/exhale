name: exhale-app
title: exhale
base: core22
version: '2.0.23'
summary: A translucent breathing overlay for mindful breathing.
description: |
  A minimal cross-platform breathing overlay: a friendly indicator and
  reminder to take full, deep breaths while looking at screens.

  Demanding work at a keyboard measurably changes how you breathe. In small
  studies, people breathed faster and mildly over-breathed during data
  entry, and forward head posture is associated with reduced lung volumes.
  Slow paced breathing is the breathing practice with the most published
  evidence behind it. Whether it counters that over-breathing is untested,
  and one study found it can add to it. exhale paces slow breathing for you
  with no sensor, no account and no telemetry.

  The overlay is a translucent window that gently expands on inhale and
  contracts on exhale. On an X11 session it stays on top and lets clicks
  pass through, so it never interrupts whatever you're doing. Wayland has
  no standard way for an app to do that, so on a Wayland session exhale
  runs as a regular window you can move and resize.

  Inhale, post-inhale hold, exhale, and post-exhale hold durations are all
  configurable. The default is 5 seconds in and 5 out with no holds, which
  is 6 breaths a minute, where most of the direct evidence was gathered.
  The range tested directly runs from 5 to 7 a minute. Box breathing
  (4 / 4 / 4 / 4) is supported too, though at 3.75 breaths a minute it
  falls below that range. Making the exhale longer than the inhale is a
  matter of preference, since the studies comparing ratios are split.

  Every claim above is sourced, alongside a ledger of what the research
  doesn't support, at
  https://github.com/peterklingelhofer/exhale/blob/main/docs/CITATIONS.md

  Features:
  - Translucent overlay that expands on inhale and contracts on exhale
  - Fully tunable inhale / hold / exhale / hold cadence
  - Five breathing patterns as one-click presets, with the current rate
    shown against the tested range
  - Customisable colours, shapes (fullscreen, circle, or rectangle), and
    opacity
  - Runs from the system tray: preferences, the research page, start/stop
    animation, reset to defaults, quit
  - Optional reminder notifications

  Few side effects are expected from slow breathing. The sliders also reach
  fast, hold-heavy patterns, where brief light-headedness and muscle cramps
  have been reported, so slow down or stop if you feel either.

  Disclaimer: The information and guidance provided by this app are for
  general informational purposes only and aren't medical advice. The creator
  isn't a medical professional. Always seek the advice of a qualified
  healthcare provider with any questions about your health, and don't
  disregard or delay professional medical advice because of this app. Use is
  at your own risk.

grade:       stable
confinement: strict
icon:        snap/gui/exhale.png

license: MIT

apps:
  exhale:
    command: usr/bin/exhale
    extensions: [gnome]
    plugs:
      - wayland
      - x11
      - opengl
      - desktop
      - desktop-legacy
      - home
      - unity7            # legacy AppIndicator tray protocol
    desktop: usr/share/applications/exhale.desktop

parts:
  # The `rust` plugin can build workspace members directly, but we lean on
  # `override-build` so the invocation mirrors `cargo-deb` / CI and so we
  # can pin to `--no-default-features` (global-hotkeys off, which matches
  # the Mac App Store policy, and snap confinement wouldn't grant
  # global-hotkey access anyway)
  exhale:
    plugin: nil
    # snapcraft.yaml lives at snap/snapcraft.yaml so the project dir is the
    # repo root. Source the whole tree so `override-build` can `cd rust`
    source: .
    source-type: local
    build-packages:
      - curl
      - ca-certificates
      - build-essential
      - pkg-config
      - libssl-dev
      - libx11-dev
      - libxcb1-dev
      - libxkbcommon-dev
      - libwayland-dev
      - libglib2.0-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - libvulkan-dev
      - libxdo-dev
    # Keep this list minimal: the `gnome` extension brings in gtk/glib and
    # most display stack runtimes.  Extra packages here balloon the built
    # snap and have been linked to LXD "Failed to execute pack in instance"
    # failures on CI. Drop mesa-vulkan-drivers (wgpu falls back to GL)
    stage-packages:
      - libayatana-appindicator3-1
      - libxdo3
    override-build: |
      set -euo pipefail

      # Install rustup into the build container. The first cargo call in
      # rust/ then fetches the toolchain rust/rust-toolchain.toml pins.
      # snapcraft's build hosts don't ship rust. This mirrors what
      # `.github/workflows/release.yml` does for the Linux snap job
      if ! command -v cargo >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain none --profile minimal
      fi
      # shellcheck disable=SC1090
      . "${HOME}/.cargo/env"

      cd rust
      cargo build --release --no-default-features -p exhale-app

      install -D -m 755 target/release/exhale \
        "${CRAFT_PART_INSTALL}/usr/bin/exhale"
      install -D -m 644 packaging/linux/exhale.desktop \
        "${CRAFT_PART_INSTALL}/usr/share/applications/exhale.desktop"
      install -D -m 644 packaging/linux/icons/256x256/exhale.png \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/apps/exhale.png"
      install -D -m 644 packaging/linux/icons/512x512/exhale.png \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/512x512/apps/exhale.png"
