name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: swift

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project exhale.xcodeproj -scheme exhale

      - name: Build
        run: >
          xcodebuild build -project exhale.xcodeproj -scheme exhale
          -destination 'platform=macOS' -configuration Debug
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        # `CI=true` is set on the runner shell by GitHub Actions, but
        # `xcodebuild test` doesn't propagate the shell environment
        # to the xctest target's subprocess. The step's `env:` block
        # reaches `xcodebuild` itself. The test runner it spawns never
        # sees it.  Xcode's documented escape hatch: any env var prefixed
        # with `TEST_RUNNER_` is forwarded to the test runner with the
        # prefix stripped.  So `TEST_RUNNER_CI=true` lands in the
        # xctest process as `CI=true`, which `PerformanceTests`'s
        # `isCI` branch reads via `ProcessInfo.processInfo.environment`
        # to pick the looser CPU thresholds calibrated for runner
        # noise instead of the tighter local thresholds.  Confirmed by
        # a prior failure measuring 8.18% avg under the 8.0% local
        # threshold despite the runner setting `CI=true` in the shell.
        # The test target wasn't seeing the env var
        env:
          CI: "true"
        run: >
          xcodebuild test -project exhale.xcodeproj -scheme exhale
          -destination 'platform=macOS' -configuration Debug
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          TEST_RUNNER_CI=true
          TEST_RUNNER_GITHUB_ACTIONS=true
          -resultBundlePath ../TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: TestResults.xcresult

  # docs/CITATIONS.md is generated from the CSL-JSON corpus plus the
  # hand-written notes, so it can silently fall behind either one.  This
  # job also validates citekey format, the group / verification / access /
  # tier enums, and every anchor link the gaps ledger makes into the
  # corpus, so a renamed entry fails here instead of rotting in the docs.
  # Stdlib only and no Rust toolchain, so it costs seconds
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check generated citations are current
        run: python3 scripts/generate-citations.py --check

  # `exhale-core` has no wgpu, winit or GTK dependency, so it checks and tests
  # on a plain Linux runner in under a minute
  core-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --locked -p exhale-core --all-targets -- -D warnings

      - name: cargo test
        working-directory: rust
        run: cargo test --locked -p exhale-core

  # The other two crates need a windowing stack to compile, and macOS is the
  # one runner that has it without system packages. This is the only place
  # `exhale-app`'s tests run in CI. The `--no-default-features` check covers
  # builds without global hotkeys
  app-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --locked -p exhale-render -p exhale-app --all-targets -- -D warnings

      - name: cargo test
        working-directory: rust
        run: cargo test --locked -p exhale-render -p exhale-app

      - name: cargo check (no global hotkeys)
        working-directory: rust
        run: cargo check --locked -p exhale-app --no-default-features
