# Pre-release dev builds for the Rust port: runs on every push to `main`
# and on pull requests into it, and uploads unsigned, unpackaged binaries
# for Windows and Linux as workflow artifacts on the push runs (PR runs
# build-only, to catch breakage before merge without piling up artifacts)
#
# Lets a developer grab a fresh `exhale.exe` / Linux binary without
# setting up the full local toolchain on the target platform, most
# useful when iterating on cross-platform fixes from a macOS dev box,
# or when a Windows ARM VM's MSVC toolchain isn't yet wired up
#
# Complements `release.yml`:
#   - `release.yml` fires on `v*` tags, signs/packages everything as
#     MSIX / .pkg / .deb / .snap / .AppImage for store submission.
#   - This workflow fires on every push and pull request, skips signing/
#     packaging, dumps the raw release binary for direct execution /
#     manual sideloading

name: Dev Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (stable + ARM64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build (x64)
        working-directory: rust
        run: cargo build --release -p exhale-app

      - name: Upload x64 artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: exhale-windows-x64
          path: rust/target/release/exhale.exe

      # ARM64 cross-compile: `windows-2025` ships with the ARM64
      # MSVC build tools as part of the default VS 2022 install, so
      # this should "just work."  Marked continue-on-error in case the
      # runner image regresses on that. x64 stays available either way
      - name: Build (ARM64)
        working-directory: rust
        run: cargo build --release -p exhale-app --target aarch64-pc-windows-msvc
        continue-on-error: true

      - name: Upload ARM64 artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: exhale-windows-arm64
          path: rust/target/aarch64-pc-windows-msvc/release/exhale.exe
          if-no-files-found: warn

  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      # Same dependency set as local Linux dev: gtk + wayland + xkbcommon
      # for winit, xdo for global-hotkey, ssl for HTTP-using crates,
      # appindicator for tray-icon's Linux backend
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwayland-dev libxkbcommon-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev pkg-config

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        working-directory: rust
        run: cargo build --release -p exhale-app

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: exhale-linux-x64
          path: rust/target/release/exhale

  # Native ARM64 Linux build: runs on GitHub's free `ubuntu-22.04-arm`
  # runner so we don't need cross-compilation gymnastics for the system
  # dependencies (gtk3, wayland, etc.)
  linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwayland-dev libxkbcommon-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev pkg-config

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        working-directory: rust
        run: cargo build --release -p exhale-app

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: exhale-linux-arm64
          path: rust/target/release/exhale
