<line x1="354.5" y1="98.0" x2="354.5" y2="234.0" stroke="#21262d"/>
<line x1="488.5" y1="98.0" x2="488.5" y2="234.0" stroke="#21262d"/>
<line x1="622.5" y1="98.0" x2="622.5" y2="234.0" stroke="#21262d"/>
