<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="patterns-title patterns-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="patterns-title">Heart rate variability rise by breathing pattern</title>
<desc id="patterns-desc">RMSSD above each person's baseline, in standard deviations. 84 college students, one session each. 4/0/6/0 (6 a minute): 0.65. 5/0/5/0 (6 a minute, default): 0.45. 4/7/8/0 (3.16 a minute, 4-7-8): 0.27. 4/4/4/4 (3.75 a minute, box): 0.25.</desc>
<text x="0" y="20" fill="#e6edf3" font-size="15" font-weight="600">Heart rate variability rise by breathing pattern</text>
<text x="0" y="40" fill="#9198a1" font-size="13">RMSSD above each person's baseline, in standard deviations. 84 college students, one session each.</text>
<rect x="0.0" y="56" width="12" height="12" rx="2" fill="#3987e5"/>
<text x="18.0" y="66" fill="#9198a1" font-size="12">6 a minute, no holds</text>
<rect x="160.0" y="56" width="12" height="12" rx="2" fill="#6e7681"/>
<text x="178.0" y="66" fill="#9198a1" font-size="12">With holds, under 4 a minute</text>
