<svg xmlns="http://www.w3.org/2000/svg" width="720" height="314" viewBox="0 0 720 314" role="img" aria-labelledby="cycles-title cycles-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="cycles-title">One breath cycle, pattern by pattern</title>
<desc id="cycles-desc">Seconds per cycle. The shaded band covers 5 to 7 breaths a minute, the range tested directly. 5/0/5/0 (default): inhale 5, hold 0, exhale 5, hold 0, 10 seconds a cycle, 6 breaths a minute. 4/0/6/0: inhale 4, hold 0, exhale 6, hold 0, 10 seconds a cycle, 6 breaths a minute. 5/0/5/2: inhale 5, hold 0, exhale 5, hold 2, 12 seconds a cycle, 5 breaths a minute. 5/0/10/0 (earlier default): inhale 5, hold 0, exhale 10, hold 0, 15 seconds a cycle, 4 breaths a minute. 4/4/4/4 (box): inhale 4, hold 4, exhale 4, hold 4, 16 seconds a cycle, 3.75 breaths a minute. 4/7/8/0 (4-7-8): inhale 4, hold 7, exhale 8, hold 0, 19 seconds a cycle, 3.16 breaths a minute.</desc>
